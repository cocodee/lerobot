# WebXR Teleoperation Configuration for SimRobotPandaHil
#
# Usage:
#   bash scripts/run_teleoperate_webxr_panda.sh --config_path=configs/teleoperate_webxr_panda.yaml

# ===============================================
# Robot (SimRobotPandaHil) Configuration
# ===============================================
robot:
  type: sim_robot_panda_hil
  # URDF path for IK/FK calculations
  # Update this to your actual URDF file path
  urdf_path: "/home/smai/workspace/dikeke/franka_description/fr3_urdfs/fr3_franka_hand_obj.urdf"

  # MuJoCo XML path for simulation
  # Update this to your actual XML file path
  xml_path: "/home/smai/workspace/dikeke/franka_description/fr3_urdfs/fr3_franka_hand_obj.xml"

  # Target end-effector frame name in URDF
  target_frame_name: "hand"
  kinematics_solver: "berobot"    
  # End-effector workspace boundaries (min and max for x, y, z)
  end_effector_bounds:
    min: [-2.0, -2.0, -2.0]
    max: [2.0, 2.0, 2.0]

  # Position step sizes (scaling factors for delta positions)
  end_effector_step_sizes:
    x: 1.0
    y: 1.0
    z: 1.0

  # Maximum gripper position (in meters)
  max_gripper_pos: 0.04

# ===============================================
# Teleoperator (WebXR) Configuration
# ===============================================
teleop:
  # Zenoh connection endpoint
  # Format: "tcp/<ip>:<port>" or "ws/<url>"
  type: webxr
  zenoh_connect_key: "tcp/47.116.8.214:7447"
  robot_type: "sim_robot_panda"


# ===============================================
# Control Configuration
# ===============================================
fps: 30

# Teleoperation duration in seconds (null = unlimited)
teleop_time_s: null
